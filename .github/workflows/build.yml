name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Signing secrets are missing. Add KEYSTORE_B64 and KEYSTORE_PASSWORD in the repo settings."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/habbitstrick.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/habbitstrick.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=habbitstrick" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Habbit-Strick.apk

      - name: Write version info
        env:
          RUN: ${{ github.run_number }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          CODE=$((100 + RUN))
          SIZE=$(stat -c%s Habbit-Strick.apk)
          NOTE=$(printf '%s' "$MSG" | head -1)
          jq -n --argjson c "$CODE" --arg n "1.$RUN" --arg t "$NOTE" --argjson s "$SIZE" '{versionCode:$c,versionName:$n,notes:$t,size:$s}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            Habbit-Strick.apk
            version.json

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy the app into the desktop shell
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/app | Out-Null
          Copy-Item app/src/main/assets/index.html desktop/app/index.html

      - name: Install and build the Windows installer
        shell: pwsh
        working-directory: desktop
        env:
          RUN: ${{ github.run_number }}
        run: |
          npm pkg set version="1.$env:RUN.0"
          npm install --no-audit --no-fund
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/Habbit-Strick-Setup.exe
            desktop/dist/Habbit-Strick-Setup.exe.blockmap
            desktop/dist/latest.yml

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/Habbit-Strick.apk out/version.json out/Habbit-Strick-Setup.exe out/Habbit-Strick-Setup.exe.blockmap out/latest.yml --target "${{ github.sha }}" --title "Habbit Strick" --notes "Latest build. Android: Habbit-Strick.apk. Windows: Habbit-Strick-Setup.exe."

  website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site
        run: |
          mkdir -p _site
          cp app/src/main/assets/index.html _site/index.html
          cp -r web/. _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
