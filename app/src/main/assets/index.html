<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Habbit Strick</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23000'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='%23ff4f6d' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#050505;--card:#111112;--card2:#18181a;--line:rgba(255,255,255,.07);--text:#f4f4f5;--muted:#8d8d94;--accent:#ff4f6d;--pink:#ff8fa3;--display:"Syne","Arial Black",system-ui,sans-serif;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--text);font:16px/1.45 var(--sans);background:radial-gradient(circle at 90% -5%,rgba(255,79,109,.13),transparent 40%),radial-gradient(circle at -10% 105%,rgba(255,79,109,.07),transparent 45%),var(--bg);background-attachment:fixed;padding-bottom:130px;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:26px 18px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:12px}
h1{font:800 clamp(30px,9vw,42px)/1.05 var(--display);letter-spacing:-.02em;margin:0;word-break:break-word}
.sub{color:var(--muted);font-size:14px;margin-top:8px}
.ib{width:46px;height:46px;border-radius:16px;border:1px solid var(--line);background:var(--card2);color:var(--text);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.ib svg{width:20px;height:20px}
.ib.sm{width:40px;height:40px;border-radius:14px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(92%,400px);display:flex;padding:8px;background:rgba(20,20,22,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;z-index:20}
.tab{flex:1;background:none;border:0;border-radius:18px;color:var(--muted);padding:9px 4px 7px;font:500 11px var(--sans);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .2s}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--text);background:rgba(255,255,255,.08)}
.tab.on svg{color:var(--accent)}
.tile{position:relative;background:radial-gradient(circle at 50% 60%,#050505 0%,#141415 75%);border:1px solid var(--line);border-radius:28px;padding:18px;overflow:hidden}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.lbl{font-size:14px;font-weight:500}
.foot{font-size:12.5px;color:var(--muted)}
.foot b{color:var(--text);font-weight:500}
.num{font:800 clamp(38px,12vw,54px)/1 var(--display);color:var(--accent);letter-spacing:-.03em;margin:20px 0 18px}
.num small{font-size:.4em;letter-spacing:0;margin-left:3px;color:var(--pink)}
.w1{display:flex;flex-direction:column;justify-content:space-between;min-height:176px}
.ring{width:70px;height:70px;position:relative;margin-bottom:26px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rt,.rf{fill:none;stroke-width:5}
.rt{stroke:rgba(255,255,255,.1)}
.rf{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .6s}
.rn{position:absolute;inset:0;display:grid;place-items:center;font:700 24px var(--display)}
.big{font:800 52px/1 var(--display);letter-spacing:-.03em;margin:14px 0 26px}
.big small{font:500 18px var(--sans);color:var(--muted);margin-left:4px;letter-spacing:0}
.wk{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.wk .m{font:700 17px var(--display)}
.wk .ib{width:38px;height:38px;border-radius:13px}
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;margin:0 -18px 22px;padding:2px 120px 4px;scrollbar-width:none;touch-action:pan-x pan-y;text-align:center;position:relative}
.strip::-webkit-scrollbar{display:none}
.wd{flex:none;width:52px;scroll-snap-align:center}
.wd.fut button{border-style:dashed}
.wd button{width:100%;max-width:46px;aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--text);font:500 12px var(--sans);cursor:pointer;margin:0 auto;display:grid;place-items:center;padding:0}
.wd.sel button{background:var(--text);color:#000;border-color:var(--text);font-weight:700}
.wd.now button{border-color:var(--accent)}
.wd small{display:block;color:var(--muted);font-size:11.5px;margin-top:7px}
.sec{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
h2{font:700 20px var(--display);margin:0;letter-spacing:-.01em}
.bd{background:rgba(255,255,255,.1);border-radius:8px;padding:2px 9px;font-size:12.5px;font-weight:500}
.swr{position:relative;border-radius:22px;margin-bottom:10px;overflow:hidden;background:var(--card2);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.swr .acts{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:stretch}
.swr .al{flex:1;display:flex;align-items:center;padding-left:22px;background:var(--accent);color:#fff;font-weight:700}
.swr .ar{display:flex;width:300px;flex:none}
.swr .ab{flex:1;border:0;border-left:1px solid rgba(255,255,255,.08);background:#26262a;color:var(--text);font:500 13.5px var(--sans);cursor:pointer;padding:0}
.swr .ab.dl{background:#4a1520;color:var(--pink)}
.swr .tk{position:relative;margin:0;border:0;border-radius:22px;transition:transform .22s ease;touch-action:pan-y;flex-wrap:nowrap;background:var(--card)}
.swr.lift{z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.6);outline:1.5px solid var(--accent)}
.swr.lift .tk{transition:none}
.tk{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:10px}
.chk{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);background:none;flex:none;cursor:pointer;display:grid;place-items:center;padding:0;transition:all .2s}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk svg{width:15px;height:15px;display:none;color:#fff}
.chk.on svg{display:block}
.tn{flex:1;min-width:0;word-break:break-word;font-weight:500;cursor:pointer}
.tk.done .tn>.nm{color:var(--muted);text-decoration:line-through}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:middle}
.tn .bar{margin:8px 0 5px}
.stp{display:flex;gap:6px;flex:none}
.mb{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:600 20px/1 var(--sans);cursor:pointer;padding:0;display:grid;place-items:center}
.mb.run{background:var(--accent);border-color:var(--accent);color:#fff}
.mb svg{width:16px;height:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:16px}
input,select,textarea{font:inherit;color:var(--text);background:#000;border:1px solid var(--line);border-radius:14px;padding:13px;min-width:0;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--accent);flex:none}
.fr{display:flex;gap:10px;margin-top:10px}
textarea{min-height:90px;font-size:13px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:13px 18px;font:700 15px var(--sans);cursor:pointer}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:8px 13px;font-size:13.5px;font-weight:500}
.btn.danger{background:none;color:var(--pink);border:1px solid var(--line)}
.btn.full{width:100%;margin-top:10px}
.heat{background:linear-gradient(180deg,#2b0e14,#4a1520);border-radius:28px;padding:18px;margin-bottom:12px;border:1px solid rgba(255,79,109,.18)}
.hw{display:flex;gap:8px}
.hl{display:grid;grid-template-rows:repeat(7,1fr);font-size:10.5px;color:rgba(255,255,255,.7);align-items:center;gap:3px}
.hc{flex:1;display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.c{aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.08)}
.c.f{opacity:.3}
.c.x{background:rgba(255,255,255,.04)}
.c.l0{background:rgba(255,255,255,.2)}
.c.bk{background:#5a1020;outline:1px solid #ff4f6d}
.qb{display:flex;gap:6px;flex:none}
.qb button{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:9px 10px;font:600 12.5px var(--sans);cursor:pointer}
.qb .f.on{background:#5ee0a0;border-color:#5ee0a0;color:#06210f}
.qb .b.on{background:#ff4f6d;border-color:#ff4f6d;color:#fff}
.tk.qh .tn{min-width:0}
.tk.qh.done .tn>.nm{text-decoration:none;color:var(--text)}
.tk.broke .tn>.nm{color:var(--pink)}
.c.l1{background:#7d2a3b}
.c.l2{background:#c73a5a}
.c.l3{background:var(--pink)}
.c.l4{background:var(--accent)}
.c.ice{background:#7fb5ff}
.hr{text-align:center;font-size:13.5px;margin-top:14px;color:rgba(255,255,255,.9)}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s}
.pt{margin-bottom:16px;cursor:pointer}
.pt:last-child{margin-bottom:0}
.pr{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:8px;gap:10px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px 18px;margin-bottom:8px}
.rec .r1{display:flex;justify-content:space-between;align-items:center}
.rec span{color:var(--muted);font-size:14px}
.rec .nt{font-size:13.5px;color:var(--text);margin-top:6px;opacity:.85}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:15px}
.brand{font:700 12px var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.fl{font-size:12px;color:var(--muted);margin:12px 0 6px}
[hidden]{display:none!important}
.lockscr{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;overflow:auto;background:radial-gradient(circle at 90% -5%,rgba(255,79,109,.13),transparent 40%),var(--bg)}
.lk{width:min(100%,380px)}
body.locked .wrap,body.locked .tabs{display:none}
input[type=date],input[type=time]{min-height:48px}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.days{display:flex;gap:6px;margin-top:10px}
.days button{flex:1;aspect-ratio:1;max-width:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--text);font:500 13px var(--sans);cursor:pointer;padding:0}
.days button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chkrow{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px;font-size:14px}
.chip button{border:0;background:none;color:var(--muted);font:600 15px var(--sans);cursor:pointer;padding:0 4px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:14px;padding:9px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit}
.mood b{font:700 17px var(--display);color:var(--text)}
.mood small{font-size:10.5px}
.mood.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mood.on b{color:#fff}
.banner{background:linear-gradient(180deg,#2b0e14,#3a131b);border:1px solid rgba(255,79,109,.25);border-radius:22px;padding:14px 16px;margin-bottom:14px}
.banner p{margin:0 0 10px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#fff;color:#000;border-radius:14px;padding:11px 16px;font:500 14px var(--sans);opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.act{pointer-events:auto}
#toast .tu{margin-left:14px;border:0;background:none;color:#d6203f;font:700 14px var(--sans);cursor:pointer;padding:0}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.tpls{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.tpls button{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:7px 11px;font:500 13px var(--sans);cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.calh{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;color:var(--muted);font-size:12px;margin-bottom:8px}
.cd{aspect-ratio:1;border:1px solid transparent;border-radius:12px;background:rgba(255,255,255,.06);color:var(--text);font:500 14px var(--sans);padding:0;cursor:pointer}
.cd.l0{background:rgba(255,255,255,.2)}.cd.l1{background:#7d2a3b}.cd.l2{background:#c73a5a}.cd.l3{background:var(--pink);color:#000}.cd.l4{background:var(--accent)}.cd.ice{background:#7fb5ff;color:#000}.cd.f{opacity:.35}.cd.now{border-color:var(--text)}.cd.sel{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;gap:8px;margin-top:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:10px 6px;font:500 14px var(--sans);cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.skrow{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:12px 16px;margin-bottom:8px}
.skrow .nm{color:var(--muted);text-decoration:line-through}
body.amoled{--bg:#000;--card:#0a0a0b;--card2:#111113;background:#000}
body.big .wrap{zoom:1.12}
@keyframes sl{from{opacity:.4;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:.4;transform:translateX(-26px)}to{opacity:1;transform:none}}
#main.sl{animation:sl .22s ease}
#main.sr{animation:sr .22s ease}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .bc i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:rgba(255,255,255,.12);min-height:4px}
.bars .bc.hi i{background:var(--accent)}
.bars .bc small{font-size:11px;color:var(--muted);margin-top:7px}
.bars .bc em{font:normal 600 11px var(--sans);margin-bottom:4px;color:var(--text)}
.trend{width:100%;height:auto;display:block}
.bgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bgc{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:12px;opacity:.38}
.bgc.on{opacity:1;border-color:rgba(255,79,109,.35)}
.bgc .ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.bgc.on .ic{background:var(--accent);color:#fff}
.bgc .ic svg{width:15px;height:15px}
.bgc b{display:block;font-size:13.5px;line-height:1.2}
.bgc span{font-size:11.5px;color:var(--muted);line-height:1.2;display:block;margin-top:2px}
.cmp{display:flex;gap:10px;align-items:baseline;margin:4px 0 8px}
.cmp b{font:800 34px var(--display)}

.todh{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.sw{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.sw button.on{border-color:var(--text)}
.sw button.none{width:auto;padding:0 12px;border-radius:15px;background:var(--card2);border:1px solid var(--line);color:var(--muted);font:500 12px var(--sans)}
.sw button.none.on{border-color:var(--text);color:var(--text)}
.chal{display:flex;gap:16px;align-items:center;margin-bottom:12px;min-height:0}
.chal .ring{margin:0}
.sg{color:var(--muted);font-size:12px;font-weight:400;margin-left:6px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:120}
.conf i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:cf 1.8s ease-in forwards}
@keyframes cf{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
#tour{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.62);display:grid;place-items:end center;padding:18px 18px calc(110px + env(safe-area-inset-bottom,0px))}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;width:min(100%,420px)}
.tcard h3{font:700 22px var(--display);margin:10px 0 8px}
.tcard p{margin:0 0 14px;color:var(--muted);font-size:15px}
.td{display:flex;gap:6px}.td i{width:20px;height:4px;border-radius:2px;background:var(--line)}.td i.on{background:var(--accent)}
body.light{--bg:#f4f4f7;--card:#ffffff;--card2:#eeeef2;--line:rgba(0,0,0,.1);--text:#141416;--muted:#6b6b73;background:radial-gradient(circle at 90% -5%,rgba(255,79,109,.10),transparent 40%),#f4f4f7}
body.light .tile{background:#fff}
body.light .tabs{background:rgba(255,255,255,.88);border-color:rgba(0,0,0,.08)}
body.light .tab.on{background:rgba(0,0,0,.07)}
body.light .rt{stroke:rgba(0,0,0,.1)}
body.light .chk{border-color:rgba(0,0,0,.3)}
body.light .bd{background:rgba(0,0,0,.08)}
body.light input,body.light select,body.light textarea{background:#fff}
body.light .bar{background:rgba(0,0,0,.1)}
body.light .c{background:rgba(0,0,0,.08)}
body.light .c.x{background:rgba(0,0,0,.04)}
body.light .c.l0{background:rgba(0,0,0,.18)}
body.light .heat{background:linear-gradient(180deg,#ffe6ea,#ffc9d3);border-color:rgba(255,79,109,.3)}
body.light .hl{color:rgba(0,0,0,.6)}
body.light .hr{color:#2a2a2e}
body.light .banner{background:#ffeef1;border-color:rgba(255,79,109,.3)}
body.light .swr .ab{background:#e3e3e8;color:#141416;border-left-color:rgba(0,0,0,.08)}
body.light .swr .ab.dl{background:#ffd9df;color:#c01f3c}
body.light .swr.lift{box-shadow:0 12px 30px rgba(0,0,0,.2)}
body.light .wd.sel button{background:#141416;color:#fff;border-color:#141416}
body.light .bars .bc i{background:rgba(0,0,0,.12)}
body.light .bars .bc.hi i{background:var(--accent)}
body.light .bgc .ic{background:rgba(0,0,0,.08)}
body.light .cd{background:rgba(0,0,0,.06)}
body.light .cd.l0{background:rgba(0,0,0,.15)}
body.light #toast{background:#141416;color:#fff}
body.light #toast .tu{color:#ff8fa3}
body.light .lockscr{background:var(--bg)}
body.light #tour{background:rgba(0,0,0,.35)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="brand">Habbit Strick</div><h1 id="hi"></h1><div class="sub" id="eb"></div></div><div id="act"></div></div>
  <div id="main"></div>
</div>
<div id="lock" class="lockscr" hidden></div>

<script>
(function(){
var OLD='dailytracker.v1',VKEY='habbitstrick.vault';
var NAT=(typeof window.Android==='object'&&window.Android)?window.Android:null;
function nat(m,a){try{if(NAT&&typeof NAT[m]==='function')return NAT[m].apply(NAT,a||[]);}catch(e){}return undefined;}
function blank(){return {tasks:[],log:{},notes:{},meta:{},seen:{},skip:{},broke:{},vac:[],timer:null};}
function norm(o){
  if(!o||typeof o!=='object')o={};
  if(!Array.isArray(o.tasks))o.tasks=[];
  if(!o.log||typeof o.log!=='object')o.log={};
  if(!o.notes||typeof o.notes!=='object')o.notes={};
  if(!o.meta||typeof o.meta!=='object')o.meta={};
  if(!o.seen||typeof o.seen!=='object')o.seen={};
  if(!o.skip||typeof o.skip!=='object')o.skip={};
  if(!o.broke||typeof o.broke!=='object')o.broke={};
  if(!Array.isArray(o.vac))o.vac=[];
  if(o.timer===undefined)o.timer=null;
  return o;
}
var S=blank(),key=null,salt=null,q=Promise.resolve(),W=null;
var lockMode='unlock',lockErr='',busy=false,fails=0,resetArm=false,smsg='',hiddenAt=0,bioTried=false,tickId=null;
var view='today',prevView='today',cur=null,detailId=null,backupText='',msg='',delId=null,openId=null,F=null,ferr='',G=null,slideDir=null,lastGesture=0,impArm=false,toastT=null,noteT=null;
var CATS=['General','Work','Study','Health','Home','Personal'];
var CATCOL={General:'#8d8d94',Work:'#7fb5ff',Study:'#ffc857',Health:'#5ee0a0',Home:'#ff9f6b',Personal:'#ff8fa3'};
var TPL=[{n:'Drink water',cat:'Health',t:8,u:'glasses',s:1,tm:false},{n:'Workout',cat:'Health',t:45,u:'min',tm:true},{n:'Read',cat:'Study',t:20,u:'min',tm:true},{n:'Meditate',cat:'Personal',t:10,u:'min',tm:true},{n:'Walk',cat:'Health',t:30,u:'min',tm:true},{n:'Study session',cat:'Study',t:60,u:'min',tm:true},{n:'Write journal',cat:'Personal',t:1,u:'',tm:false},{n:'Sleep before 11',cat:'Health',t:1,u:'',tm:false},{n:'Clean room',cat:'Home',t:1,u:'',tm:false},{n:'No smoking',cat:'Health',t:1,u:'',tm:false,q:true},{n:'No junk food',cat:'Health',t:1,u:'',tm:false,q:true},{n:'No social media scrolling',cat:'Personal',t:1,u:'',tm:false,q:true},{n:'No phone after 11 pm',cat:'Personal',t:1,u:'',tm:false,q:true}];
var ACTW=300,CELLW=58;
var AUTO={name:'',msg:''},autoT=null,vmsg='',tourI=-1;
var SWC=['#ff4f6d','#ff9f6b','#ffc857','#5ee0a0','#4fd1c5','#7fb5ff','#c4c4cc'];
var UPD={chk:false,has:false,name:'',code:0,notes:'',busy:false,pct:0,msg:'',cur:'',later:false,checked:false};
var TQ='',TC='All',calM=null,undoSnap=null,keepStrip=null,stripStart=null,stripCount=0,liveDate=null,stripT=null;
var DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var DL=['M','T','W','T','F','S','S'];
var MOODS=['Rough','Low','Okay','Good','Great'];
var LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';
var CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg>';
var PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
var LEFT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
var RIGHT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
var PLAY='<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>';
var STOP='<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg>';

/* ---------- crypto and storage ---------- */
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function derive(pw,s){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(m){return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});}
function enc(text){var iv=crypto.getRandomValues(new Uint8Array(12));return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(text)).then(function(ct){return {s:b64(salt),i:b64(iv),d:b64(ct)};});}
function persist(){return enc(JSON.stringify(S)).then(function(v){localStorage.setItem(VKEY,JSON.stringify(v));});}
function save(){if(!key)return;W=null;q=q.then(persist).catch(function(){});syncNative();if(AUTO.name){clearTimeout(autoT);autoT=setTimeout(doAuto,20000);}}
function decryptVault(v,k){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb(v.i)},k,unb(v.d)).then(function(buf){return JSON.parse(new TextDecoder().decode(buf));});}
function unlockWith(v,pw){var s=unb(v.s);return derive(pw,s).then(function(k){return decryptVault(v,k).then(function(o){S=norm(o);key=k;salt=s;});});}

/* ---------- date helpers ---------- */
function pad(n){return n<10?'0'+n:''+n;}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function shift(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ds(d);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function today(){return ds(new Date());}
function dow(s){return (parse(s).getDay()+6)%7;}
function lf(s,o){return parse(s).toLocaleDateString(undefined,o);}
function fmtNum(x){x=Math.round(x*10)/10;return String(x);}
function mmss(m){var s=Math.max(0,Math.floor(m*60)),mm=Math.floor(s/60),ss=s%60;return pad(mm)+':'+pad(ss);}
cur=today();

/* ---------- task model ---------- */
function byId(id){for(var i=0;i<S.tasks.length;i++)if(S.tasks[i].id===id)return S.tasks[i];return null;}
function tgt(t){return t.target>0?+t.target:1;}
function sched(t){return t.sched||'daily';}
function val(date,id){var l=S.log[date];var v=l&&l[id];return v?+v:0;}
function isDone(date,t){if(isWT(t))return wkSum(t,date,true)>=wkT(t)-1e-9;return val(date,t.id)>=tgt(t)-1e-9;}
function setVal(date,id,v){var l=S.log[date]||(S.log[date]={});v=Math.max(0,Math.round(v*100)/100);if(v>0)l[id]=v;else delete l[id];}
function active(t,date){if(t.type==='once')return t.date===date;return t.created<=date&&(!t.archived||t.archived>date);}
function isBroke(date,t){var k=S.broke&&S.broke[date];return !!(k&&k[t.id]);}
function isQuit(t){return t.kind==='quit';}
function isSkipped(date,t){var k=S.skip&&S.skip[date];return !!(k&&k[t.id]);}
function onDay(t,date){
  if(!active(t,date))return false;
  if(isSkipped(date,t))return false;
  if(inVac(date))return false;
  if(t.type==='once')return true;
  if(sched(t)==='days')return (t.days||[]).indexOf(dow(date))>=0;
  return true;
}
function isWT(t){return t.type!=='once'&&sched(t)==='wtotal';}
function isWeekly(t){return t.type!=='once'&&(sched(t)==='weekly'||sched(t)==='wtotal');}
function wkT(t){return isWT(t)?(+t.wt>0?+t.wt:1):(t.wk||3);}
function inVac(date){var v=S.vac||[];for(var i=0;i<v.length;i++)if(date>=v[i].a&&date<=v[i].b)return true;return false;}
function tcol(t){return t.color||CATCOL[t.cat]||'#8d8d94';}
function wkSum(t,date,upto){var m=shift(date,-dow(date)),n=0;for(var i=0;i<7;i++){var d=shift(m,i);if(upto&&d>date)break;if(t.created<=d)n+=val(d,t.id);}return Math.round(n*100)/100;}
function dayList(date){return S.tasks.filter(function(t){return onDay(t,date);});}
function skippedList(date){return S.tasks.filter(function(t){return active(t,date)&&isSkipped(date,t);});}
function sortPinned(a){var p=[],o=[];a.forEach(function(t){(t.pin?p:o).push(t);});return p.concat(o);}
function dayStat(date){
  var a=dayList(date),d=0,n=0;
  a.forEach(function(t){
    var dn=isDone(date,t);
    if(isWeekly(t)){var rd=dn;if(isWT(t))rd=dn&&val(date,t.id)>0&&(wkSum(t,date,true)-val(date,t.id))<wkT(t)-1e-9;if(rd){d++;n++;}}
    else{n++;if(dn)d++;}
  });
  return {total:n,done:d,pct:n?d/n:null};
}
function weekCount(t,date){
  if(isWT(t))return wkSum(t,date,false);
  var m=shift(date,-dow(date)),n=0;
  for(var i=0;i<7;i++){var d=shift(m,i);if(t.created<=d&&isDone(d,t))n++;}
  return n;
}
function firstDate(){
  var m=today();
  S.tasks.forEach(function(t){var x=t.type==='once'?t.date:t.created;if(x<m)m=x;});
  return m;
}
function dayNames(days){
  days=(days||[]).slice().sort();
  if(days.length===7)return 'Every day';
  return days.map(function(i){return DN[i];}).join(' ');
}
function walk(){
  var t=today(),f=firstDate(),run=0,best=0,perfect=0,avail=0,since=0,frozen={},d=f,used=0,pr=0,pweeks=0;
  while(d<=t){
    var s=dayStat(d),isT=(d===t);
    if(s.total>0){
      if(s.pct===1){
        run++;perfect++;since++;pr++;
        if(run>best)best=run;
        if(since%7===0&&avail<2)avail++;
      }else if(!isT){
        pr=0;
        if(avail>0){avail--;used++;frozen[d]=1;}
        else{run=0;since=0;}
      }
    }else if(!isT){pr=0;}
    if(dow(d)===6&&pr>=7)pweeks++;
    d=shift(d,1);
  }
  return {cur:run,best:best,perfect:perfect,avail:avail,frozen:frozen,used:used,pweeks:pweeks};
}
function getW(){if(!W)W=walk();return W;}
function totalChecks(){
  var n=0;
  S.tasks.forEach(function(t){for(var d in S.log){if(S.log[d][t.id]&&isDone(d,t))n++;}});
  return n;
}
function xpInfo(){
  var w=getW(),xp=totalChecks()*10+w.perfect*20;
  return {xp:xp,lvl:Math.floor(xp/250)+1,into:xp%250};
}
function avg(days){
  var t=today(),sum=0,n=0;
  for(var i=0;i<days;i++){var s=dayStat(shift(t,-i));if(s.total){sum+=s.pct;n++;}}
  return n?Math.round(sum/n*100):0;
}
function weekPct(monday,upto){
  var dn=0,tt=0;
  for(var d=monday;d<=upto;d=shift(d,1)){var s=dayStat(d);dn+=s.done;tt+=s.total;}
  return tt?Math.round(dn/tt*100):0;
}
function weekProgress(){var t=today();return weekPct(shift(t,-dow(t)),t);}

/* ---------- badges ---------- */
var BADGES=[
  {id:'first',n:'First step',d:'Complete a task',ok:function(c){return c.checks>=1;}},
  {id:'s7',n:'7 day streak',d:'Reach a 7 day streak',ok:function(c){return c.w.best>=7;}},
  {id:'s30',n:'30 day streak',d:'Reach a 30 day streak',ok:function(c){return c.w.best>=30;}},
  {id:'s100',n:'100 day streak',d:'Reach a 100 day streak',ok:function(c){return c.w.best>=100;}},
  {id:'pw',n:'Perfect week',d:'Finish everything Mon to Sun',ok:function(c){return c.w.pweeks>=1;}},
  {id:'c25',n:'25 check-ins',d:'Complete 25 tasks',ok:function(c){return c.checks>=25;}},
  {id:'c100',n:'100 check-ins',d:'Complete 100 tasks',ok:function(c){return c.checks>=100;}},
  {id:'c500',n:'500 check-ins',d:'Complete 500 tasks',ok:function(c){return c.checks>=500;}},
  {id:'l5',n:'Level 5',d:'Reach level 5',ok:function(c){return c.x.lvl>=5;}},
  {id:'full',n:'Full house',d:'Have 5 active every day tasks',ok:function(c){return c.act>=5;}}
];
function badgeCtx(){
  return {w:getW(),checks:totalChecks(),x:xpInfo(),act:S.tasks.filter(function(t){return t.type==='daily'&&!t.archived;}).length};
}
function maybeBadges(){
  var c=badgeCtx(),fresh=[],first=!S.meta.badgesInit;
  BADGES.forEach(function(b){if(b.ok(c)&&!S.seen[b.id]){S.seen[b.id]=1;if(!first)fresh.push(b.n);}});
  if(first)S.meta.badgesInit=1;
  if(first||fresh.length){save();}
  if(fresh.length)toast('Badge unlocked: '+fresh.join(', '));
}
function toast(m,undo){
  var el=document.getElementById('toast');if(!el)return;
  el.innerHTML=esc(m)+(undo?'<button class="tu" data-a="undo">Undo</button>':'');
  el.classList.toggle('act',!!undo);el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},undo?5000:3200);
}
function withUndo(msg,fn){var snap=JSON.stringify(S);fn();undoSnap=snap;toast(msg,true);}
function doUndo(){
  if(!undoSnap)return;
  try{S=norm(JSON.parse(undoSnap));}catch(e){return;}
  undoSnap=null;var el=document.getElementById('toast');if(el)el.classList.remove('show');
  hap(10);save();render();
}
function hap(ms){
  if(S.meta&&S.meta.haptic===0)return;
  if(NAT&&typeof NAT.haptic==='function'){nat('haptic',[ms||10]);return;}
  try{if(navigator.vibrate)navigator.vibrate(ms||10);}catch(e){}
}
function applyPrefs(){
  var m=S.meta||{};
  document.body.classList.toggle('amoled',m.theme==='amoled');
  document.body.classList.toggle('light',m.theme==='light');
  var cs=document.querySelector('meta[name=color-scheme]');if(cs)cs.setAttribute('content',m.theme==='light'?'light':'dark');
  document.body.classList.toggle('big',m.text==='large');
}
function applyQueue(){
  if(!NAT||!key||typeof NAT.takeQueue!=='function')return;
  var raw=nat('takeQueue');if(!raw)return;
  var arr=[];try{arr=JSON.parse(raw);}catch(e){return;}
  if(!arr||!arr.length)return;
  var ch=false;
  arr.forEach(function(x){
    var tk=byId(x.id);
    if(!tk||!/^\d{4}-\d\d-\d\d$/.test(String(x.d)))return;
    setVal(x.d,x.id,x.v?tgt(tk):0);if(S.broke[x.d])delete S.broke[x.d][x.id];ch=true;
  });
  if(ch){save();render();}
}

/* ---------- timer ---------- */
function elapsedMin(){if(!S.timer)return 0;return Math.max(0,(Date.now()-S.timer.start)/60000);}
function startTimer(id){if(S.timer)stopTimer(true);S.timer={id:id,start:Date.now(),date:cur};save();}
function stopTimer(silent){
  if(!S.timer)return;
  var tm=S.timer,t=byId(tm.id),m=elapsedMin();
  if(t){
    var prior=val(tm.date,tm.id),nv=isWT(t)?prior+m:Math.min(prior+m,Math.max(tgt(t),prior));
    setVal(tm.date,tm.id,nv);
  }
  S.timer=null;save();
  if(!silent)render();
}
function checkTimer(){
  if(!S.timer)return false;
  var tm=S.timer,t=byId(tm.id);
  if(!t){S.timer=null;save();return true;}
  if(!isWT(t)&&val(tm.date,tm.id)+elapsedMin()>=tgt(t)){stopTimer(true);toast('Timer done: '+t.name);return true;}
  return false;
}
function tick(){
  if(!key||!S.timer)return;
  if(checkTimer()){render();return;}
  var tm=S.timer,t=byId(tm.id);if(!t)return;
  var wt0=isWT(t),tg=wt0?wkT(t):tgt(t),tot=(wt0?wkSum(t,tm.date,true):val(tm.date,tm.id))+elapsedMin();
  var lab=document.querySelector('[data-live="'+tm.id+'"]');
  if(lab)lab.textContent=fmtNum(tot)+' / '+fmtNum(tg)+' min, '+mmss(elapsedMin());
  var bar=document.querySelector('[data-bar="'+tm.id+'"]');
  if(bar)bar.style.width=Math.min(100,tot/tg*100)+'%';
}

/* ---------- native sync ---------- */
function syncNative(){
  if(!NAT||!key)return;
  try{
    var t=today(),st=dayStat(t),w=getW(),rem=[],done=[];
    S.tasks.forEach(function(x){
      if(isDone(t,x))done.push(x.id);
      if(x.rem&&x.rem.length&&!x.archived&&(x.type==='daily'||x.date>=t)&&!inVac(t)){
        rem.push({id:x.id,name:x.name,times:x.rem,days:(x.type==='daily'&&sched(x)==='days')?(x.days||[]):null,date:x.type==='once'?x.date:null,from:x.created||x.date,q:isQuit(x),vac:(S.vac&&S.vac.length)?S.vac:null});
      }
    });
    var lst=sortPinned(dayList(t)).filter(function(x){return tgt(x)<=1&&!x.timer&&!isWeekly(x);});
    var pend=lst.filter(function(x){return !isDone(t,x);}),dn2=lst.filter(function(x){return isDone(t,x);});
    var items=pend.concat(dn2).slice(0,4).map(function(x){return {id:x.id,name:x.name,done:isDone(t,x)};});
    nat('sync',[JSON.stringify({date:t,done:st.done,total:st.total,streak:w.cur,reminders:rem,doneIds:done,items:items})]);
  }catch(e){}
}

/* ---------- lock screen ---------- */
function bioOn(){return NAT&&nat('bioEnabled')===true;}
function lockUI(){
  var el=document.getElementById('lock'),setup=lockMode==='setup',bio=!setup&&bioOn();
  el.innerHTML='<div class="lk"><div class="brand">Habbit Strick</div><h1>'+(setup?'Create password':'Welcome back')+'</h1><div class="sub">'+(setup?'This password locks the app and encrypts your data on this device. If you forget it, your data cannot be recovered.':'Enter your password to open.')+'</div><div class="panel" style="margin-top:22px"><input type="password" class="lkin" id="lp" placeholder="Password" autocomplete="'+(setup?'new-password':'current-password')+'">'+(setup?'<input type="password" class="lkin" id="lp2" placeholder="Confirm password" autocomplete="new-password" style="margin-top:10px">':'')+(lockErr?'<p class="hint" style="color:var(--pink)">'+esc(lockErr)+'</p>':'')+'<button class="btn full" data-a="lkgo"'+(busy?' disabled':'')+'>'+(busy?'Please wait':(setup?'Create and open':'Unlock'))+'</button>'+(bio?'<button class="btn ghost full" data-a="bio">Use fingerprint</button>':'')+'</div>'+(setup?'':'<div class="fr" style="justify-content:center;flex-wrap:wrap">'+(NAT?'<button class="btn ghost sm" data-a="lkbk">Back up data now</button>':'')+'<button class="btn ghost sm" data-a="lkreset">'+(resetArm?'Tap again to erase everything':'Forgot password?')+'</button></div>')+'</div>';
  document.body.classList.add('locked');el.hidden=false;
  if(bio&&!bioTried&&!busy){bioTried=true;setTimeout(function(){nat('bioUnlock');},300);}
  else setTimeout(function(){var f=document.getElementById('lp');if(f&&!busy&&!bio)f.focus();},0);
}
function openApp(){
  document.body.classList.remove('locked');document.getElementById('lock').hidden=true;
  view='today';cur=today();F=null;openId=null;delId=null;detailId=null;
  applyPrefs();checkTimer();
  clearInterval(tickId);tickId=setInterval(tick,1000);
  applyQueue();render();syncNative();
  AUTO.name=String(nat('autoFolderName')||'');
  if(AUTO.name){clearTimeout(autoT);autoT=setTimeout(doAuto,6000);}
  if(!S.meta.tour&&tourI<0)setTimeout(function(){if(key&&!S.meta.tour&&tourI<0)showTour();},600);
  if(NAT&&!UPD.checked&&!UPD.chk)checkUpd(false);
}
function lkgo(pwArg){
  if(busy)return;
  var pw=(typeof pwArg==='string')?pwArg:document.getElementById('lp').value;lockErr='';
  if(lockMode==='setup'){
    var pw2=document.getElementById('lp2').value;
    if(pw.length<6){lockErr='Use at least 6 characters.';lockUI();return;}
    if(pw!==pw2){lockErr='The two passwords do not match.';lockUI();return;}
    var data=blank();
    try{var raw=localStorage.getItem(OLD);if(raw){var p=JSON.parse(raw);if(p&&p.tasks&&p.log)data=norm(p);}}catch(e){}
    busy=true;lockUI();
    var ns=crypto.getRandomValues(new Uint8Array(16));

function trendSvg(){
  var t=today(),pts=[],i;
  for(i=29;i>=0;i--){
    var sum=0,n=0;
    for(var k=0;k<7;k++){var s=dayStat(shift(t,-i-k));if(s.total){sum+=s.pct;n++;}}
    pts.push(n?sum/n:null);
  }
  var W2=300,H=100,line='',segs=[],cur2=[];
  pts.forEach(function(p,ix){
    if(p===null){if(cur2.length)segs.push(cur2);cur2=[];}
    else cur2.push((ix/29*W2).toFixed(1)+','+(H-p*H).toFixed(1));
  });
  if(cur2.length)segs.push(cur2);
  var svg='<svg class="trend" viewBox="0 0 300 110" role="img" aria-label="30 day trend"><g stroke="rgba(255,255,255,.1)" stroke-width="1"><line x1="0" y1="0" x2="300" y2="0"/><line x1="0" y1="50" x2="300" y2="50"/><line x1="0" y1="100" x2="300" y2="100"/></g>';
  segs.forEach(function(sg){
    if(sg.length===1){var xy=sg[0].split(',');svg+='<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="3" fill="#ff4f6d"/>';}
    else svg+='<polyline points="'+sg.join(' ')+'" fill="none" stroke="#ff4f6d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  });
  svg+='</svg>';
  return segs.length?svg:'<div class="empty">Complete a few days to see your trend.</div>';
}
function weekdayBars(){

/* ---------- task detail ---------- */
function strength(t){
  if(t.type==='once')return null;
  var f=t.created,tdy=today(),v=0,d,lim=shift(tdy,-400);
  if(f<lim)f=lim;
  if(isWeekly(t)){
    var mon=shift(f,-dow(f)),m=Math.pow(.5,1/4),cm=shift(tdy,-dow(tdy));
    for(d=mon;d<=cm;d=shift(d,7)){
      var fr=Math.min(1,weekCount(t,d)/wkT(t));
      if(d===cm&&fr<1)break;
      v=v*m+fr*(1-m);
    }
    return Math.round(v*100);
  }
  var nd=sched(t)==='days'?Math.max(1,(t.days||[]).length):7,m2=Math.pow(.5,Math.sqrt(nd/7)/13);
  for(d=f;d<=tdy;d=shift(d,1)){
    if(!onDay(t,d))continue;
    var fr2=Math.min(1,val(d,t.id)/tgt(t));
    if(d===tdy&&fr2<=0&&!isBroke(d,t))continue;
    v=v*m2+fr2*(1-m2);
  }
  return Math.round(v*100);
}
function chalDone(t){var n=0,d=t.created,tdy=today();while(d<=tdy){if(onDay(t,d)&&isDone(d,t))n++;d=shift(d,1);}return n;}
function chalHtml(t){
  var n=Math.min(t.chal,chalDone(t)),arc=n/t.chal*213.6;
  return '<div class="tile chal"><div class="ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" class="rt"/><circle cx="40" cy="40" r="34" class="rf" style="stroke-dasharray:'+arc+' 213.6"/></svg><div class="rn" style="font-size:18px">'+n+'</div></div><div><div class="lbl">'+t.chal+' day challenge</div><div class="foot">'+(n>=t.chal?'Complete. Well done!':(t.chal-n)+' days to go')+'</div></div></div>';
}
var MILES=[7,30,100,365];
function confetti(){
  var el=document.createElement('div');el.className='conf';
  var cols=['#ff4f6d','#ffc857','#5ee0a0','#7fb5ff','#ff8fa3'],h='',i;
  for(i=0;i<36;i++)h+='<i style="left:'+Math.round(Math.random()*100)+'%;background:'+cols[i%5]+';animation-delay:'+(Math.random()*.4).toFixed(2)+'s"></i>';
  el.innerHTML=h;document.body.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},2400);
}
function celebrate(id){
  var t=byId(id);if(!t||cur!==today()||!isDone(cur,t))return;
  var c=S.meta.cele||(S.meta.cele={}),msg=null,i;
  if(t.type==='daily'&&!isWeekly(t)){
    var st=taskWalk(t).cur;
    for(i=MILES.length-1;i>=0;i--){if(st>=MILES[i]){if((c[id]||0)<MILES[i]){c[id]=MILES[i];msg=t.name+': '+MILES[i]+' day streak!';}break;}}
  }
  if(!msg&&t.chal&&chalDone(t)>=t.chal&&!c[id+'c']){c[id+'c']=1;msg='Challenge complete: '+t.name;}
  if(msg){save();confetti();hap(40);setTimeout(function(){toast(msg);},60);}
}
function taskWalk(t){
  var f=t.type==='once'?t.date:t.created,tdy=today(),run=0,best=0,checks=0,d=f,n30=0,d30=0,wk=isWeekly(t);
  while(d<=tdy){
    var on=onDay(t,d),dn=on&&isDone(d,t);
    if(dn)checks++;
    if(on&&!wk){
      if(dn){run++;if(run>best)best=run;}
      else if(d!==tdy)run=0;
    }
    d=shift(d,1);
  }
  for(var i=0;i<30;i++){
    var dd=shift(tdy,-i);
    if(wk){continue;}
    if(onDay(t,dd)){n30++;if(isDone(dd,t))d30++;}
  }
  if(wk){var tot=0;for(var j=0;j<4;j++)tot+=Math.min(wkT(t),weekCount(t,shift(tdy,-7*j)));n30=(wkT(t))*4;d30=tot;}
  return {cur:run,best:best,checks:checks,rate:n30?Math.round(d30/n30*100):0};
}

    cells+='<div class="'+cls+'" title="'+d+'"></div>';
  }
  h+='<div class="heat"><div class="hw"><div class="hl"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="hc">'+cells+'</div></div><div class="hr">Last 20 weeks</div></div>';
  h+='<div class="sec" style="margin-top:22px"><h2>Last 8 weeks</h2></div><div class="panel"><div class="bars">';

  h+='</div></div>';

    var dnm=byId(id);

      S.tasks=S.tasks.filter(function(t){return t.id!==id;});
      for(var d in S.log)delete S.log[d][id];
      for(var d3 in S.broke)delete S.broke[d3][id];
      if(S.timer&&S.timer.id===id)S.timer=null;
    });
    hap(15);
    if(view==='detail'){view=prevView==='detail'?'tasks':prevView;detailId=null;}
    save();
  }
  else if(a==='detail'){if(byId(id)){prevView=view==='detail'?prevView:view;detailId=id;view='detail';window.scrollTo(0,0);}}
  else if(a==='back'){view=prevView;detailId=null;F=null;window.scrollTo(0,0);}
  else if(a==='mood'){
    var ne=document.getElementById('nn'),n=S.notes[cur]||(S.notes[cur]={});
    if(ne)n.t=ne.value;
    n.m=(n.m===+v)?0:+v;
    save();
  }
  else if(a==='bklater'){S.meta.bkSnooze=Date.now()+3*86400000;save();}
  else if(a==='bkgo'){view='tasks';window.scrollTo(0,0);}
  else if(a==='bksave'){doBackupSave();return;}
  else if(a==='bkload'){nat('pickBackup');return;}
  else if(a==='exp'){backupText=JSON.stringify(S);msg='Plain text copy below. It is not encrypted, keep it private.';markBackup();render();var ta=document.getElementById('bk');if(ta){ta.focus();ta.select();}return;}
  else if(a==='imp'){doImport();return;}
  else if(a==='bioon'){
    var bp=document.getElementById('bpw'),pwv=bp?bp.value:'';
    var vv=null;try{vv=JSON.parse(localStorage.getItem(VKEY));}catch(er){}
    if(!pwv||!vv){smsg='Type your password first.';render();return;}
    derive(pwv,unb(vv.s)).then(function(k){return decryptVault(vv,k);}).then(function(){nat('bioEnable',[pwv]);}).catch(function(){smsg='That password is wrong.';render();});
    return;
  }
  else if(a==='biooff'){nat('bioDisable');smsg='Fingerprint unlock is off.';}
  render();
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var el=e.target;
  if(el.classList&&el.classList.contains('lkin')){var gb=document.querySelector('[data-a="lkgo"]');if(gb)gb.click();}
  else if(el.id==='fname'&&F){formSave();}
});
document.addEventListener('input',function(e){

    var n=S.notes[cur]||(S.notes[cur]={});n.t=e.target.value;

document.addEventListener('scroll',function(e){
  var el=e.target;
  if(!key||!el||!el.classList||!el.classList.contains('strip')||stripStart===null)return;
  var idx=Math.max(0,Math.min(stripCount-1,Math.round(el.scrollLeft/CELLW))),d=shift(stripStart,idx);
  if(d!==liveDate){
    liveDate=d;
    var cs=el.children,i;
    for(i=0;i<cs.length;i++)cs[i].classList.toggle('sel',cs[i].getAttribute('data-d')===d);
    var ml=document.getElementById('mlab');if(ml)ml.textContent=lf(d,{month:'long',year:'numeric'});
    var eb=document.getElementById('eb');if(eb)eb.textContent=d===today()?lf(d,{weekday:'long',day:'numeric',month:'long'}):lf(d,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
    hap(4);
  }
  clearTimeout(stripT);
  stripT=setTimeout(function(){
    if(liveDate&&liveDate!==cur){cur=liveDate;keepStrip=el.scrollLeft;render();}
  },160);
},true);
document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('.swr'))e.preventDefault();});

/* ---------- touch gestures ---------- */
var mainEl=document.getElementById('main');
function onTS(e){
  if(!key||!e.touches||e.touches.length!==1){G=null;return;}
  var p=e.touches[0],tg=e.target;
  if(tg.closest&&tg.closest('input,textarea,select,.ab,.days,.strip')){G=null;return;}
  var rowEl=tg.closest?tg.closest('.swr'):null;
  G={x:p.clientX,y:p.clientY,lx:p.clientX,ly:p.clientY,t0:Date.now(),mode:null,row:rowEl,tk:null,id:rowEl?rowEl.getAttribute('data-id'):null,week:false,dx:0,drag:false,lp:null,base:0};
  if(rowEl){
    G.tk=rowEl.querySelector('.tk');
    G.base=(openId===G.id)?-ACTW:0;
    G.lp=setTimeout(startDrag,450);
  }
}
function startDrag(){
  if(!G||G.mode||!G.row)return;
  G.drag=true;G.row.classList.add('lift');openId=null;
  hap(20);
}
function dragMove(){
  if(!G||!G.drag)return;
  G.row.style.transform='translateY('+(G.ly-G.y)+'px)';
  var rows=[].slice.call(document.querySelectorAll('.swr'));
  rows.forEach(function(r){r.style.outline='';});
  rows.forEach(function(r){
    if(r===G.row)return;
    var b=r.getBoundingClientRect();
    if(G.ly>=b.top&&G.ly<=b.bottom)r.style.outline='1.5px dashed rgba(255,79,109,.7)';
  });
  if(G.ly<110)window.scrollBy(0,-9);
  else if(G.ly>window.innerHeight-150)window.scrollBy(0,9);
}
function onTM(e){
  if(!G)return;
  var p=e.touches[0];G.lx=p.clientX;G.ly=p.clientY;
  var dx=G.lx-G.x,dy=G.ly-G.y;
  if(G.drag){if(e.cancelable)e.preventDefault();dragMove();return;}
  if(!G.mode&&(Math.abs(dx)>10||Math.abs(dy)>10)){
    clearTimeout(G.lp);
    G.mode=Math.abs(dx)>Math.abs(dy)*1.3?'h':'v';
  }
  if(G.mode==='h'){
    if(e.cancelable)e.preventDefault();
    if(G.row&&G.tk){
      var nx=Math.max(-(ACTW+20),Math.min(140,G.base+dx));
      G.dx=nx;G.tk.style.transition='none';G.tk.style.transform='translateX('+nx+'px)';
    }else{
      var mm=document.getElementById('main');
      mm.style.transition='none';mm.style.transform='translateX('+(dx*0.55)+'px)';mm.style.opacity=String(1-Math.min(Math.abs(dx)/520,.4));
    }
  }
}
function snapRow(x){
  if(!G||!G.tk)return;
  G.tk.style.transition='transform .22s ease';
  G.tk.style.transform='translateX('+x+'px)';
}
function onTE(){
  if(!G)return;
  clearTimeout(G.lp);
  var g=G,dx=g.lx-g.x;
  G=null;
  if(g.drag){
    lastGesture=Date.now();
    var y=g.ly,tid=null,after=false;
    [].slice.call(document.querySelectorAll('.swr')).forEach(function(r){
      if(r===g.row)return;
      var b=r.getBoundingClientRect();
      if(y>=b.top&&y<=b.bottom){tid=r.getAttribute('data-id');after=y>(b.top+b.height/2);}
    });
    if(tid){moveTask(g.id,tid,after);save();}
    render();
    return;
  }
  if(g.mode==='h'){
    lastGesture=Date.now();
    if(g.row){
      var nx=g.dx;
      if(nx>90){openId=null;var t=byId(g.id);if(t){setDoneState(g.id,!isDone(cur,t));}else render();}
      else if(nx<-70){openId=g.id;g.tk.style.transition='transform .22s ease';g.tk.style.transform='translateX(-'+ACTW+'px)';}
      else{openId=null;g.tk.style.transition='transform .22s ease';g.tk.style.transform='translateX(0)';}
    }else{
      var mm=document.getElementById('main'),go=F?null:swipeTarget(dx<0?1:-1),fast=Date.now()-g.t0<350&&Math.abs(dx)>40;
      if(go&&(Math.abs(dx)>70||fast)){
        mm.style.transition='none';mm.style.transform='';mm.style.opacity='';
        view=go;msg='';smsg='';delId=null;openId=null;detailId=(view==='detail')?detailId:null;
        slideDir=dx<0?'l':'r';window.scrollTo(0,0);hap(12);render();
      }else{
        mm.style.transition='transform .2s ease,opacity .2s ease';mm.style.transform='';mm.style.opacity='';
        setTimeout(function(){mm.style.transition='';},230);
      }
    }
  }
}
function onTC(){
  if(!G)return;
  clearTimeout(G.lp);
  var g=G;G=null;
  var mm=document.getElementById('main');mm.style.transition='';mm.style.transform='';mm.style.opacity='';
  if(g.drag||g.mode==='h')render();
}
function swipeTarget(dir){
  var order=['today','dash','tasks'];
  if(view==='detail'||view==='cal')return dir<0?(view==='cal'?'today':(prevView&&prevView!=='detail'?prevView:'tasks')):null;
  var i=order.indexOf(view);if(i<0)return null;
  return order[i+dir]||null;
}
mainEl.addEventListener('touchstart',onTS,{passive:true});
mainEl.addEventListener('touchmove',onTM,{passive:false});
mainEl.addEventListener('touchend',onTE,{passive:true});
mainEl.addEventListener('touchcancel',onTC,{passive:true});

/* ---------- native callbacks ---------- */

window.nativeUpdState=function(state,m,pct){
  if(state==='progress'){
    UPD.pct=pct||0;

    for(var i=0;i<els.length;i++)els[i].textContent=UPD.pct;
    return;

  UPD.busy=(state==='downloading');UPD.pct=pct||0;UPD.msg=m||'';
  if(key)render();
};
window.nativeBackupLoaded=function(text){
  backupText=String(text||'');msg='File loaded. Tap Import from box to restore it.';
  view='tasks';
  if(key)render();
};
window.nativeBack=function(){
  if(!key)return false;
  if(F){F=null;render();return true;}
  if(view==='detail'){view=prevView;detailId=null;render();return true;}
  if(view!=='today'){view='today';render();return true;}
  return false;
};
boot();
if(window.__HS_TEST)window.__hs=function(c){return eval(c);};
})();
