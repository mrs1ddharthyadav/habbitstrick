plugins {
    id 'com.android.application'
}

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.habbitstrick.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.habbitstrick.app'
        minSdk 26
        targetSdk 34
        versionCode 100 + runNo
        versionName "1.${runNo}"
    }

    // The signing key never lives in the repository. CI restores it from a GitHub secret.
    def ksFile = System.getenv('KEYSTORE_FILE')
    if (ksFile) {
        signingConfigs {
            fixed {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (ksFile) signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
}
